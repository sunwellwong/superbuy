version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: superbuyluxe-db
    environment:
      POSTGRES_USER: superbuyluxe
      POSTGRES_PASSWORD: superbuyluxe
      POSTGRES_DB: superbuyluxe
    ports:
      - "5432:5432"
    volumes:
      - sbx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbuyluxe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sbx_pgdata:
